<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Israel Job Interview Prep</title>

<!-- iOS home-screen / offline app behaviour -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Israel Prep">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#002B59">
<meta name="description" content="Offline interview preparation toolkit for a retail job in Israel.">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">

<style>
  :root{
    --sea-deep:#002B59;
    --sea:#005EB8;
    --sea-light:#E6F0FA;
    --sand:#F4F6F8;
    --sand-line:#E2E8F0;
    --ink:#0F172A;
    --ink-soft:#475569;
    --citrus:#D97706;
    --citrus-deep:#B45309;
    --success:#059669;
    --white:#FFFFFF;
    --shadow: 0 10px 30px rgba(0,43,89,0.10);
    --radius-card: 18px;
    --serif: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-top: env(safe-area-inset-top, 0px);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--sand);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  h1,h2,h3{ font-family:var(--serif); font-weight:700; margin:0; color:var(--ink); }
  p{ margin:0; }
  button{ font-family:inherit; }
  img{ max-width:100%; display:block; }
  a{ color:inherit; }

  /* ---------- App shell ---------- */
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100%;
    display:flex;
    flex-direction:column;
    position:relative;
  }

  .tab-panel{ display:none; flex:1; padding-bottom:calc(96px + var(--safe-bottom)); }
  .tab-panel.active{ display:block; }

  .content{ padding:24px 20px 8px; }
  .tab-head{ margin-bottom:20px; }
  .tab-head h2{ font-size:26px; line-height:1.2; }
  .tab-head .sub{ color:var(--ink-soft); font-size:15px; margin-top:6px; line-height:1.45; }

  /* ---------- Bottom tab bar ---------- */
  .tabbar{
    position:fixed; left:0; right:0; bottom:0;
    display:flex;
    justify-content:center;
    background:rgba(244,246,248,0.92);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--sand-line);
    padding:8px 4px calc(8px + var(--safe-bottom));
    z-index:50;
  }
  .tabbar-inner{ display:flex; width:100%; max-width:560px; justify-content:space-between; }
  .tab-btn{
    flex:1;
    background:none; border:none;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:6px 2px;
    color:var(--ink-soft);
    cursor:pointer;
    touch-action:manipulation;
  }
  .tab-btn svg{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.7; }
  .tab-btn span{ font-size:11px; letter-spacing:0.01em; }
  .tab-btn.active{ color:var(--citrus-deep); }
  .tab-btn.active svg{ stroke:var(--citrus-deep); }

  /* ---------- HOME ---------- */
  #tab-home{ padding-bottom:calc(96px + var(--safe-bottom)); }
  .hero{
    position:relative;
    width:100%;
    line-height:0;
  }
  .hero-img{ width:100%; height:auto; display:block; }
  .hero::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:230px;
    background:linear-gradient(to top, rgba(6,22,36,0.85) 0%, rgba(6,22,36,0.0) 100%);
    pointer-events:none;
  }
  .hero-copy{
    position:absolute; left:0; right:0; bottom:104px;
    padding:0 20px;
    color:#fff;
    z-index:2;
    text-align:center;
  }
  .hero-copy p{ font-size:14.5px; opacity:0.95; margin-bottom:14px; line-height:1.4; }
  .hero-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--citrus);
    color:#fff;
    border:none;
    padding:14px 26px;
    border-radius:999px;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 10px 22px rgba(0,0,0,0.28);
  }

  .home-links{ padding:22px 20px 4px; display:flex; flex-direction:column; gap:12px; }
  .quick-link{
    display:flex; align-items:center; gap:14px;
    background:var(--white);
    border:1px solid var(--sand-line);
    border-radius:14px;
    padding:14px 16px;
    cursor:pointer;
    text-align:left;
    width:100%;
  }
  .quick-link .ql-icon{
    flex:0 0 auto;
    width:40px; height:40px;
    border-radius:10px;
    background:var(--sea-light);
    display:flex; align-items:center; justify-content:center;
  }
  .quick-link .ql-icon svg{ width:20px; height:20px; stroke:var(--sea-deep); fill:none; stroke-width:1.7; }
  .quick-link .ql-text b{ display:block; font-size:15.5px; }
  .quick-link .ql-text span{ display:block; font-size:13px; color:var(--ink-soft); margin-top:2px; }

  /* ---------- MYSELF ---------- */
  .letter{
    background:var(--white);
    border-radius:var(--radius-card);
    border-left:4px solid var(--sea);
    box-shadow:var(--shadow);
    padding:24px 22px;
  }
  .letter p{
    font-family:var(--serif);
    font-size:17px;
    line-height:1.72;
    color:var(--ink);
  }
  .letter p + p{ margin-top:16px; }
  .letter .fill{ color:var(--citrus-deep); font-weight:700; font-style:normal; }
  .letter-hint{
    margin-top:16px;
    display:flex; gap:10px; align-items:flex-start;
    background:var(--sea-light);
    border-radius:12px;
    padding:13px 14px;
    color:var(--sea-deep);
    font-size:13.5px;
    line-height:1.5;
  }
  .letter-hint svg{ flex:0 0 auto; width:17px; height:17px; margin-top:1px; stroke:var(--sea-deep); fill:none; stroke-width:1.8; }
  .edit-details-btn{
    margin-top:18px;
    background:none;
    border:1.5px solid var(--sea-deep);
    color:var(--sea-deep);
    padding:10px 18px;
    border-radius:999px;
    font-size:14.5px;
    font-weight:600;
    cursor:pointer;
  }

  /* ---------- QUESTIONS ---------- */
  .qlist{ display:flex; flex-direction:column; gap:12px; }
  .qcard{
    background:var(--white);
    border:1px solid var(--sand-line);
    border-radius:16px;
    overflow:hidden;
  }
  .qcard-head{
    display:flex; align-items:center; gap:12px;
    width:100%;
    border:none; background:none;
    padding:14px 14px;
    cursor:pointer;
    text-align:left;
  }
  .qnum{
    flex:0 0 auto;
    width:30px; height:30px;
    border-radius:50%;
    background:var(--sea-light);
    color:var(--sea-deep);
    font-family:var(--serif);
    font-weight:700;
    font-size:13.5px;
    display:flex; align-items:center; justify-content:center;
  }
  .qcard.open .qnum{ background:var(--citrus); color:#fff; }
  .qtitle{ flex:1; min-width:0; }
  .qtag{ display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--sea); font-weight:700; }
  .qtext{ font-size:15px; line-height:1.4; margin-top:2px; color:var(--ink); font-weight: 700; }
  .qchev{ flex:0 0 auto; width:18px; height:18px; stroke:var(--ink-soft); fill:none; stroke-width:1.8; transition:transform .2s ease; }
  .qcard.open .qchev{ transform:rotate(180deg); }

  .qbody{ display:none; padding:0 14px 16px; }
  .qcard.open .qbody{ display:block; }
  .qimg-wrap{
    width:100%;
    aspect-ratio:16/10;
    border-radius:12px;
    overflow:hidden;
    margin-top:14px;
    margin-bottom:12px;
    background:var(--sea-light);
  }
  .qimg-wrap img{ width:100%; height:100%; object-fit:cover; }
  .qimg-fallback{
    width:100%; height:100%;
    display:none;
    flex-direction:column; align-items:center; justify-content:center;
    gap:6px;
    color:var(--sea-deep);
  }
  .qimg-fallback svg{ width:26px; height:26px; stroke:var(--sea-deep); fill:none; stroke-width:1.6; }
  .qimg-fallback span{ font-size:11.5px; color:var(--ink-soft); }
  .qanswer{ font-size:15px; line-height:1.62; color:var(--ink); }
  .qtip{
    margin-top:12px;
    display:flex; gap:9px;
    background:var(--sand);
    border:1px solid var(--sand-line);
    border-radius:10px;
    padding:11px 12px;
    font-size:13px;
    line-height:1.5;
    color:var(--ink-soft);
  }
  .qtip svg{ flex:0 0 auto; width:15px; height:15px; margin-top:2px; stroke:var(--citrus-deep); fill:none; stroke-width:1.9; }

  /* ---------- READY (ticket list) ---------- */
  .progress-row{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .progress-track{ flex:1; height:8px; background:var(--sand-line); border-radius:99px; overflow:hidden; }
  .progress-fill{ height:100%; width:0%; background:var(--citrus); border-radius:99px; transition:width .35s ease; }
  .progress-label{ font-size:13.5px; color:var(--ink-soft); white-space:nowrap; font-weight:600; }

  .ticket{
    background:var(--white);
    border-radius:var(--radius-card);
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .ticket-row{
    display:flex; align-items:center; gap:14px;
    padding:15px 18px;
    border-bottom:1px dashed var(--sand-line);
  }
  .ticket-row:last-of-type{ border-bottom:none; }
  .chk{
    flex:0 0 auto;
    width:24px; height:24px;
    border-radius:7px;
    border:1.8px solid var(--sea);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    background:var(--white);
  }
  .chk svg{ width:14px; height:14px; stroke:#fff; fill:none; stroke-width:3; opacity:0; transform:scale(0.6); transition:opacity .12s ease, transform .12s ease; }
  .ticket-row.checked .chk{ background:var(--success); border-color:var(--success); }
  .ticket-row.checked .chk svg{ opacity:1; transform:scale(1); }
  .ticket-row label{ flex:1; font-size:15px; line-height:1.4; cursor:pointer; }
  .ticket-row.checked label{ color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--sand-line); }

  .ready-note{
    margin-top:18px;
    display:flex; gap:11px;
    background:var(--sea-deep);
    color:#fff;
    border-radius:14px;
    padding:16px 16px;
  }
  .ready-note svg{ flex:0 0 auto; width:19px; height:19px; margin-top:1px; stroke:#fff; fill:none; stroke-width:1.8; }
  .ready-note p{ font-size:14px; line-height:1.55; }
  .ready-note b{ display:block; margin-bottom:2px; font-size:13px; opacity:0.85; font-weight:700; }

  /* ---------- PROFILE / FORM ---------- */
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:13.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
  .field input{
    width:100%;
    font-size:16px;
    font-family:var(--sans);
    padding:13px 14px;
    border-radius:12px;
    border:1.5px solid var(--sand-line);
    background:var(--white);
    color:var(--ink);
  }
  .field input:focus{ outline:none; border-color:var(--sea); }
  .save-btn{
    width:100%;
    background:var(--sea-deep);
    color:#fff;
    border:none;
    padding:15px;
    border-radius:12px;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
    margin-top:6px;
  }
  .profile-card{
    background:var(--white);
    border:1px solid var(--sand-line);
    border-radius:var(--radius-card);
    padding:22px 20px;
  }
  .danger-zone{ margin-top:26px; text-align:center; }
  .danger-link{
    background:none; border:none;
    color:var(--ink-soft);
    font-size:13px;
    text-decoration:underline;
    cursor:pointer;
    padding:8px;
  }

  /* ---------- Onboarding overlay ---------- */
  #onboard{
    position:fixed; inset:0;
    background:var(--sand);
    z-index:200;
    display:none;
    flex-direction:column;
    overflow-y:auto;
  }
  #onboard.show{ display:flex; }
  .onboard-inner{ max-width:520px; width:100%; margin:0 auto; padding:calc(48px + var(--safe-top)) 24px 40px; flex:1; display:flex; flex-direction:column; justify-content:center; }
  .onboard-inner h1{ font-size:27px; line-height:1.3; }
  .onboard-inner .sub{ color:var(--ink-soft); font-size:15px; margin-top:8px; line-height:1.5; margin-bottom:28px; }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:calc(100px + var(--safe-bottom));
    transform:translate(-50%, 12px);
    background:var(--ink);
    color:#fff;
    padding:11px 18px;
    border-radius:999px;
    font-size:13.5px;
    opacity:0;
    pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
    z-index:300;
    white-space:nowrap;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:0.001ms !important; animation-duration:0.001ms !important; }
  }
</style>
</head>
<body>

<div id="app">

  <!-- ============ HOME ============ -->
  <section class="tab-panel active" id="tab-home">
    <div class="hero">
      <img class="hero-img" src="images/bg.jpg" alt="Welcome to Israel">
    </div>
  </section>
</div>

<!-- ============ Bottom tab bar ============ -->
<nav class="tabbar">
  <div class="tabbar-inner">
    <button class="tab-btn active" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M4 11.5L12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
      <span>Home</span>
    </button>
    <button class="tab-btn" data-tab="myself">
      <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/></svg>
      <span>Myself</span>
    </button>
    <button class="tab-btn" data-tab="questions">
      <svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4V5z"/></svg>
      <span>Questions</span>
    </button>
    <button class="tab-btn" data-tab="ready">
      <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M8.5 12.5l2 2 4-4.5"/></svg>
      <span>Ready</span>
    </button>
    <button class="tab-btn" data-tab="profile">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.3"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6"/></svg>
      <span>Profile</span>
    </button>
  </div>
</nav>

<!-- ============ Onboarding overlay ============ -->
<div id="onboard">
  <div class="onboard-inner">
    <h1>Let's set up your profile</h1>
    <div class="sub">A few details to personalise your self-introduction. You can change these anytime from the Profile tab.</div>
    <form id="onboard-form">
      <div class="field">
        <label for="ob-name">Your name</label>
        <input id="ob-name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="ob-town">Your town</label>
        <input id="ob-town" type="text" autocomplete="address-level2" required>
      </div>
      <div class="field">
        <label for="ob-shop">Shop / workplace name</label>
        <input id="ob-shop" type="text" required>
      </div>
      <button type="submit" class="save-btn">Get started</button>
    </form>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  var STORAGE_PROFILE = "iic_profile_v1";
  var STORAGE_READY = "iic_ready_v1";

  /* ---------------- Data ---------------- */
  var QUESTIONS = [
    { tag:"Customer Service", q:"What is good customer service? Describe your customer service experience at your previous job.",
      a:"Good customer service means treating customers politely and respectfully, listening to their needs, and helping them as much as possible. At my previous job, I helped customers while packing their purchases and assisted them when they needed help finding products or with other basic requests. I always tried to be polite, helpful, and respectful.",
      tip:"This answer doesn't claim experience you may not have had. If the interviewer asks for a specific example, you can describe one." },
    { tag:"Difficult Customers", q:"How do you handle a difficult or rude customer?",
      a:"I would remain calm and listen carefully without arguing. I would try to understand the customer's concern and speak politely and respectfully. I would try to solve the problem within my responsibility. If I could not solve it myself, I would ask my supervisor for assistance." },
    { tag:"FIFO", q:"What is FIFO, and why is it important?",
      a:"FIFO means \u201cFirst In, First Out.\u201d It means that older stock is placed and used or sold before newer stock. It is important because it helps prevent products from staying too long on the shelves and helps reduce waste, especially for products with limited shelf life." },
    { tag:"Managing Multiple Tasks", q:"If you are given several tasks at the same time, how do you manage your time?",
      a:"First, I identify which task is most urgent and whether there is any safety or customer-related issue. Then I organise the tasks according to priority and complete them carefully. If I am unsure about the priorities, I communicate with my supervisor. I always make sure that safety and quality are not sacrificed for speed." },
    { tag:"Store Safety", q:"What are the main safety rules you should follow inside a supermarket or store?",
      a:"I should keep walkways clear, handle heavy items safely, clean or report spills promptly, and use equipment only if I am trained to use it. I should keep customers away from hazards, follow hygiene and food-safety procedures, report accidents or hazards to my supervisor, and follow emergency instructions." },
    { tag:"Store Maintenance", q:"What maintenance procedures do you follow in a supermarket or store?",
      a:"I keep the work area clean, safe, and organised. I check the work area and equipment before use and clean them according to workplace procedures. If I notice any damage or problem, I report it to the responsible person. I would not attempt technical repairs unless I am trained and authorised to do them." },
    { tag:"Personal Hygiene", q:"What is hygiene, and how do you maintain personal hygiene at work?",
      a:"Hygiene means keeping ourselves, our workplace, and our equipment clean to prevent contamination and maintain a safe environment. At work, I maintain good personal hygiene by washing my hands properly, wearing clean work clothes, keeping myself clean, and following workplace hygiene and food-safety procedures. I understand that wearing gloves does not replace proper hand washing." },
    { tag:"Working Under Pressure", q:"How do you stay calm under pressure?",
      a:"I stay calm and focused and deal with the tasks one at a time. I identify the most important priority and work in an organised way. I communicate with my team when necessary and avoid making careless decisions. Even when the workplace is busy, I always focus on safety, quality, and good customer service." },
    { tag:"Expired Product", q:"What would you do if you found an expired product on the shelf?",
      a:"I would remove the expired product from the shelf immediately, following the store's procedure, and inform my supervisor or the responsible person. I would also check the surrounding products if I was instructed to do so." },
    { tag:"Teamwork and Conflict", q:"How do you avoid conflicts when working as part of a team?",
      a:"I try to communicate clearly and respectfully with my team members. If there is a disagreement, I listen to the other person's point of view and try to find a practical solution. I avoid arguing and focus on the work and the team's goal. If we cannot resolve the issue ourselves, I would ask my supervisor for guidance." }
  ];

  var READY_ITEMS = [
    "Service certificates (minimum one year experience)",
    "Certificates for English language proficiency",
    "Valid passport",
    "NIC",
    "Valid driving licence",
    "School leaving certificate",
    "GCE O/L, A/L certificates",
    "Birth certificate",
    "GS certificate",
    "Two recent colour passport-sized photos with a white background"
  ];

  /* ---------------- Helpers ---------------- */
  function $(sel, ctx){ return (ctx||document).querySelector(sel); }
  function $all(sel, ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); }
  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function loadJSON(key, fallback){
    try{
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  function saveJSON(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
  }
  var toastTimer;
  function toast(msg){
    var el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 1800);
  }

  /* ---------------- Tabs ---------------- */
  function showTab(name){
    $all(".tab-panel").forEach(function(p){ p.classList.remove("active"); });
    var panel = $("#tab-" + name);
    if(panel) panel.classList.add("active");
    $all(".tab-btn").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-tab") === name); });
    window.scrollTo(0, 0);
  }
  $all(".tab-btn").forEach(function(btn){
    btn.addEventListener("click", function(){ showTab(btn.getAttribute("data-tab")); });
  });
  $all("[data-goto]").forEach(function(btn){
    btn.addEventListener("click", function(){ showTab(btn.getAttribute("data-goto")); });
  });

  /* ---------------- Profile / Myself ---------------- */
  function getProfile(){ return loadJSON(STORAGE_PROFILE, null); }

  function renderMyself(){
    var p = getProfile() || { name:"", town:"", shop:"" };
    var name = escapeHTML(p.name || "\u2014");
    var town = escapeHTML(p.town || "\u2014");
    var shop = escapeHTML(p.shop || "\u2014");
    var html =
      "<p>Good morning. Thank you for giving me this opportunity. My name is <span class=\"fill\">" + name +
      "</span>, and I am from <span class=\"fill\">" + town +
      "</span>. I have practical retail experience from <span class=\"fill\">" + shop +
      "</span>, where I worked as a Manual Packaging Assistant, Shelf Handler, and Cleaner.</p>" +
      "<p>My responsibilities included packing customers' purchases, arranging and replenishing products, maintaining clean displays, cleaning the store and storage areas, and assisting with stock-related work.</p>" +
      "<p>I am hardworking, punctual, reliable, flexible, and willing to learn. I always try to follow instructions, work responsibly, and cooperate well with my team. I am now ready to take on a new challenge and gain my first international work experience in Israel.</p>";
    $("#myself-letter").innerHTML = html;
  }

  function fillProfileForm(form, prefix, p){
    $("#" + prefix + "-name", form).value = (p && p.name) || "";
    $("#" + prefix + "-town", form).value = (p && p.town) || "";
    $("#" + prefix + "-shop", form).value = (p && p.shop) || "";
  }

  /* Onboarding */
  var onboard = $("#onboard");
  function maybeShowOnboarding(){
    if(!getProfile()){
      onboard.classList.add("show");
    }
  }
  $("#onboard-form").addEventListener("submit", function(e){
    e.preventDefault();
    var p = {
      name: $("#ob-name").value.trim(),
      town: $("#ob-town").value.trim(),
      shop: $("#ob-shop").value.trim()
    };
    saveJSON(STORAGE_PROFILE, p);
    onboard.classList.remove("show");
    renderMyself();
    fillProfileForm(document, "pf", p);
  });

  /* Profile tab edit */
  $("#profile-form").addEventListener("submit", function(e){
    e.preventDefault();
    var p = {
      name: $("#pf-name").value.trim(),
      town: $("#pf-town").value.trim(),
      shop: $("#pf-shop").value.trim()
    };
    saveJSON(STORAGE_PROFILE, p);
    renderMyself();
    toast("Details saved");
  });

  $("#reset-app").addEventListener("click", function(){
    if(confirm("This clears your saved name, town, shop and checklist progress on this device. Continue?")){
      localStorage.removeItem(STORAGE_PROFILE);
      localStorage.removeItem(STORAGE_READY);
      location.reload();
    }
  });

  /* ---------------- Questions ---------------- */
  function renderQuestions(){
    var wrap = $("#qlist");
    var html = QUESTIONS.map(function(item, i){
      var n = i + 1;
      var num = (n < 10 ? "0" + n : "" + n);
      return (
        '<div class="qcard" data-index="' + i + '">' +
          '<button class="qcard-head" type="button">' +
            '<span class="qnum">' + num + '</span>' +
            '<span class="qtitle"><span class="qtag">' + escapeHTML(item.tag) + '</span><span class="qtext">' + escapeHTML(item.q) + '</span></span>' +
            '<svg class="qchev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>' +
          '</button>' +
          '<div class="qbody">' +
            '<div class="qanswer">' + escapeHTML(item.a) + '</div>' +
            '<div class="qimg-wrap">' +
              '<img src="images/Qs/' + n + '.jpg" alt="' + escapeHTML(item.tag) + '" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">' +
              '<div class="qimg-fallback"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10.5" r="1.6"/><path d="M21 16l-5.5-5-4 4-2.5-2.5L3 17"/></svg><span>Add images/Qs/' + n + '.jpg</span></div>' +
            '</div>' +
            (item.tip ? '<div class="qtip"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="8.01"/><line x1="12" y1="11" x2="12" y2="16"/></svg><span>' + escapeHTML(item.tip) + '</span></div>' : '') +
          '</div>' +
        '</div>'
      );
    }).join("");
    wrap.innerHTML = html;

    $all(".qcard-head", wrap).forEach(function(head){
      head.addEventListener("click", function(){
        head.parentElement.classList.toggle("open");
      });
    });
  }

  /* ---------------- Ready checklist ---------------- */
  function renderReady(){
    var state = loadJSON(STORAGE_READY, {});
    var wrap = $("#ticket-list");
    var html = READY_ITEMS.map(function(text, i){
      var checked = !!state[i];
      return (
        '<div class="ticket-row' + (checked ? ' checked' : '') + '" data-index="' + i + '">' +
          '<span class="chk"><svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg></span>' +
          '<label>' + escapeHTML(text) + '</label>' +
        '</div>'
      );
    }).join("");
    wrap.innerHTML = html;
    updateProgress(state);

    $all(".ticket-row", wrap).forEach(function(row){
      row.addEventListener("click", function(){
        var idx = row.getAttribute("data-index");
        var s = loadJSON(STORAGE_READY, {});
        s[idx] = !s[idx];
        saveJSON(STORAGE_READY, s);
        row.classList.toggle("checked", !!s[idx]);
        updateProgress(s);
      });
    });
  }
  function updateProgress(state){
    var done = READY_ITEMS.reduce(function(sum, _, i){ return sum + (state[i] ? 1 : 0); }, 0);
    var pct = Math.round((done / READY_ITEMS.length) * 100);
    $("#progress-fill").style.width = pct + "%";
    $("#progress-label").textContent = done + " of " + READY_ITEMS.length + " ready";
  }

  /* ---------------- Init ---------------- */
  function init(){
    renderMyself();
    renderQuestions();
    renderReady();
    var p = getProfile();
    if(p){ fillProfileForm(document, "pf", p); }
    maybeShowOnboarding();
  }
  init();

  /* ---------------- Service worker (offline support) ---------------- */
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){ /* offline registration is best-effort */ });
    });
  }
})();
</script>
</body>
</html>
